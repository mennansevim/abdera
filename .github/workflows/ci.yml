name: CI

# Phase 0: henuz uygulama kodu yok, bu is akisi Phase 1'de aktif hale gelir.
# Simdilik yalnizca secret sizintisi ve markdown/link kontrolu icin bir iskelet.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env dosyasi commit'lenmis mi kontrol et
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]'; then
            echo "HATA: .env dosyasi repoya commit'lenmis. Repo public - bunu asla yapma."
            exit 1
          fi
          echo "OK: .env commit'lenmemis."


name: CI

# Backend, frontend ve uc kritik rol smoke testi ayni degisikligi ayri kalite katmanlarinda
# korur. Integration testleri Testcontainers ile, browser smoke testi ise gercek Compose
# uygulamasina karsi calisir (docs/09-testing.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guard-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: .env dosyasi commit'lenmis mi kontrol et
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.[^e]'; then
            echo "HATA: .env dosyasi repoya commit'lenmis. Repo public - bunu asla yapma."
            exit 1
          fi
          echo "OK: .env commit'lenmemis."

  backend-build-test:
    runs-on: ubuntu-latest
    # Testcontainers.PostgreSql kendi Postgres container'ini Docker daemon'i uzerinden
    # dogrudan baslatiyor (bkz. AbderaWebApplicationFactory) - ubuntu-latest runner'inda
    # Docker zaten hazir calisiyor, ayri bir `services: postgres` bloguna gerek yok (ikisi
    # ayni is icin cakisan/gereksiz bir ikinci Postgres olurdu).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Faz 4: Integration/OpsFlowTests.cs gercek `pg_dump` calistiriyor (BackupService,
      # Backup:Provider=Fake yalnizca depolama/e-postayi sahteler, pg_dump gercek calisir) -
      # ubuntu-latest runner imajinda genelde hazir gelir ama acikca kurmak bu bagimliligi
      # dokumante eder ve imaj varsayilanlarindaki degisikliklere karsi kirilgan olmaz.
      # Runner imajinda pg_dump zaten varsa apt-get update'in ~10 sn'si atlanir.
      - run: command -v pg_dump || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: dotnet restore backend/Abdera.slnx
      - run: dotnet build backend/Abdera.slnx --no-restore
      - run: dotnet test backend/Abdera.slnx --no-build

  # frontend-build-lint acildi (docs/14-ui-design-prompt.md) - banking/page.tsx'teki
  # onceden flag'lenen react/no-unescaped-entities hatasi artik yok, `npm run lint`
  # temiz donuyor (dogrulandi).
  frontend-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend

  # Diger islere `needs` ile bagli DEGIL: smoke kendi Compose imajlarini sifirdan kurdugu
  # icin onlarin ciktisina ihtiyaci yok, paralel kosunca CI ~3 dk kisaliyor. Deploy yine
  # tum islerin yesilini bekler - deploy.yml CI koşusunun TOPLAM sonucuna
  # (workflow_run.conclusion == success) bakar, abdera-deploy skill'i de `gh run watch
  # --exit-status` ile tum kosuyu bekler; herhangi bir is kirmiziysa kosu kirmizidir.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Development smoke ortamini hazirla
        run: |
          cp .env.example .env
          sed -i 's/POSTGRES_PASSWORD=<GUCLU-PAROLA-URET>/POSTGRES_PASSWORD=CiPostgresOnly123!/' .env
          sed -i 's/Bootstrap__AdminPassword=<ILK-GIRISTE-DEGISTIR>/Bootstrap__AdminPassword=CiAdminOnly123!/' .env
          # Giris ve veli OTP uclari IP basina 15 dakikada 5 istekle sinirli. Smoke suite'i
          # tek kosuda 2 admin girisi + 2 OTP tuketiyor; bir test yeniden denenirse (retries: 1)
          # bu sinir asilir ve testler URUN HATASI OLMADAN kirmizi doner.
          # Sinir DEVRE DISI BIRAKILMIYOR - yalnizca smoke ortaminda yeniden denemeye yer
          # birakacak kadar yukseltiliyor. Kuralin kendisi backend testlerinde dogrulaniyor
          # (RateLimitingFlowTests kendi dusuk limitli factory'siyle).
          sed -i 's/^RateLimiting__LoginPermitLimit=.*/RateLimiting__LoginPermitLimit=50/' .env
          sed -i 's/^RateLimiting__GuardianOtpPermitLimit=.*/RateLimiting__GuardianOtpPermitLimit=50/' .env
      - run: npm ci --prefix frontend
      # Tarayici ikilileri Playwright surumune gore onbellege alinir; sistem paketleri
      # (install-deps) onbellekte tutulamadigi icin her kosuda kurulur.
      - name: Playwright surumunu bul
        id: playwright
        run: echo "version=$(node -p "require('./frontend/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      # Compose imajlari buildx + GitHub Actions cache ile kurulur: restore/npm ci/apk
      # katmanlari degismedikce yeniden calismaz (.github/docker-compose.ci-cache.yml).
      - uses: docker/setup-buildx-action@v3
      # type=gha onbellegi ACTIONS_RUNTIME_TOKEN/ACTIONS_RESULTS_URL ister; bunlari
      # yalnizca build-push-action kendiliginden gecirir, compose icin disari aktarilir.
      - uses: crazy-max/ghaction-github-runtime@v3
      - name: Compose uygulamasini baslat
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci-cache.yml up --build -d
      - name: Saglik kontrolunu bekle
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health >/dev/null && curl --fail --silent http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Uc rol Playwright smoke
        env:
          E2E_ADMIN_EMAIL: admin@example.com
          E2E_ADMIN_PASSWORD: CiAdminOnly123!
        run: npm run test:e2e --prefix frontend
      - name: Hata durumunda servis loglari
        if: failure()
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci-cache.yml logs --no-color --tail=250
      - name: Compose kaynaklarini temizle
        if: always()
        run: docker compose -f docker-compose.yml -f .github/docker-compose.ci-cache.yml down -v

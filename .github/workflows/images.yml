name: Images

# Okul başına kurulum için imajlar (docs/multi-tenant/ARCHITECTURE.md §5.5, B13). Okul sunucuları
# derleme yapmaz; buradan GHCR'ye itilen imajları DIGEST ile çeker (§16.4).
#
# Yalnızca sürüm etiketi (v<YYYY.MM.DD.N>) ya da elle tetiklenir: main'e push'ta çalışmaz,
# bugünkü CI/Deploy akışına dokunmaz.
on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (YYYY.MM.DD.N)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sürümü belirle
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || { echo "Geçersiz sürüm: $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Modül kataloğu
        run: |
          # dotnet run "Building..." satırını stdout'a yazar; derlenmiş dll doğrudan çalıştırılır.
          dotnet build backend/src/Abdera.Api -c Release -o "$RUNNER_TEMP/api" -v quiet
          dotnet "$RUNNER_TEMP/api/Abdera.Api.dll" --print-module-catalog > module-catalog.json
          dotnet "$RUNNER_TEMP/api/Abdera.Api.dll" --print-branch-catalog > branch-catalog.json
          python3 -c "import json; json.load(open('module-catalog.json')); json.load(open('branch-catalog.json'))"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API imajı
        id: api
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ steps.version.outputs.owner }}/abdera-api:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Web imajı
        id: web
        uses: docker/build-push-action@v6
        with:
          # NEXT_PUBLIC_API_BASE_URL verilmez: üretimde göreli /api (tek imaj her okulda çalışır, A10).
          context: frontend
          push: true
          tags: ghcr.io/${{ steps.version.outputs.owner }}/abdera-web:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # §16.4: geri dönüş, migration'ları uygulanmış şema üzerinde bir önceki imajın çalışmasına dayanır.
      # Yeni imaj boş bir veritabanına migration'ları uygular; ardından önceki sürümün imajı AYNI
      # veritabanında açılıp /health'e cevap vermeli. Vermezse sürüm kaydı üretilmez (geri dönüşü bozan
      # bir migration - örn. kolon silme - aynı sürümde yapılmış demektir).
      - name: Geri dönüş uyumluluğu (yeni şemada önceki imaj)
        run: |
          OWNER="${{ steps.version.outputs.owner }}"
          PREVIOUS="$(git ls-remote --tags origin 'refs/tags/v*' | sed 's|.*refs/tags/v||' | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n -k4,4n | grep -vx "${{ steps.version.outputs.version }}" | tail -n1 || true)"
          if [ -z "$PREVIOUS" ]; then echo "Önceki sürüm yok; atlandı."; exit 0; fi
          docker network create compat
          docker run -d --name compat-db --network compat -e POSTGRES_DB=abdera -e POSTGRES_USER=abdera -e POSTGRES_PASSWORD=compat postgres:16-alpine
          for i in $(seq 1 30); do docker exec compat-db pg_isready -U abdera -d abdera && break; sleep 2; done
          run_api() {
            docker run -d --name "$1" --network compat -e ASPNETCORE_ENVIRONMENT=Development \
              -e "ConnectionStrings__Default=Host=compat-db;Database=abdera;Username=abdera;Password=compat" \
              -e Bootstrap__AdminEmail=compat@abdera.test -e Bootstrap__AdminPassword=Compat-Parola-2026 "$2"
            for i in $(seq 1 40); do
              docker exec "$1" wget -q --spider http://localhost:8080/health && return 0
              sleep 3
            done
            docker logs "$1" | tail -50
            return 1
          }
          run_api compat-new "ghcr.io/$OWNER/abdera-api@${{ steps.api.outputs.digest }}"
          docker rm -f compat-new
          docker pull "ghcr.io/$OWNER/abdera-api:$PREVIOUS"
          run_api compat-old "ghcr.io/$OWNER/abdera-api:$PREVIOUS"
          echo "OK: $PREVIOUS imajı ${{ steps.version.outputs.version }} şemasında açıldı."

      - name: Sürüm kaydı
        run: |
          OWNER="${{ steps.version.outputs.owner }}"
          python3 - <<PY
          import json
          release = {
              "version": "${{ steps.version.outputs.version }}",
              "revision": "${{ github.sha }}",
              "apiImage": "ghcr.io/$OWNER/abdera-api@${{ steps.api.outputs.digest }}",
              "webImage": "ghcr.io/$OWNER/abdera-web@${{ steps.web.outputs.digest }}",
              "modules": json.load(open("module-catalog.json")),
              "categories": json.load(open("branch-catalog.json")),
          }
          json.dump(release, open("release.json", "w"), ensure_ascii=False, indent=2)
          PY
          cat release.json

      # Platform yeni sürümü bu dosyadan kaydeder (releases tablosu, digest + katalog).
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release.json

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abdera}
      POSTGRES_USER: ${POSTGRES_USER:-abdera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env icinde tanimli olmali}
    # LOADTEST.md Round 1: varsayilan max_connections (~100, birkaci superuser icin ayrilmis)
    # tek basina api'nin Npgsql pool'u tarafindan doldurulabiliyordu - 500 VU'luk bir yuk
    # testinden SONRA bile idle-ama-acik pool baglantilari (Npgsql varsayilani: 5 dk'ya kadar)
    # butun sunucu capini tutup psql/pgAdmin/migration gibi disaridan gelen HERHANGI bir
    # istemciyi "sorry, too many clients already" ile reddediyordu (LOADTEST.md Round 1
    # bulgusu - api'nin kendisi calismaya devam ediyordu, sorun yalnizca DISARIDAN erisimdi).
    # api'nin havuzu artik ConnectionStrings__Default'ta "Maximum Pool Size=150" ile sinirli
    # (asagida) - buradaki 250 o sinirin USTUNE, diger istemciler icin pay birakiyor.
    #
    # LOADTEST.md Round 2 duzeltmesi: ilk denemede pool 50'ye sabitlenmisti - 500 VU'luk ramp
    # kademesinde 50 baglanti icin 10x talep olusup istekler kuyrukta beklemeye basladi (p95
    # 349ms -> 1.37s, p99 625ms -> 2.59s, gercek 5xx YOK - yalnizca kuyruklama gecikmesi).
    # 150'ye cikarilinca 500 VU'nun coğu paralel calisabiliyor, 250'lik max_connections'ta da
    # disaridan erisim icin 100 baglantilik pay kaliyor.
    command: postgres -c max_connections=250
    ports:
      # Yalnizca host uzerinden erisilebilir - veritabani hicbir zaman
      # dogrudan internete acilmaz.
      - "127.0.0.1:5432:5432"
    volumes:
      - abdera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abdera} -d ${POSTGRES_DB:-abdera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # docker-compose ag adi uzerinden baglanir - .env'deki POSTGRES_HOST=db ile tutarli.
      # Maximum Pool Size=150: Npgsql varsayilani (100) sinirsizdi, ilk duzeltmede 50'ye
      # sabitlenmisti ama 500 VU'luk ramp kademesinde bu darbogaz oldu (LOADTEST.md Round 2).
      # 150'ye cikarilinca (Round 3) p95 500ms hedefine 13ms kala kaldi (513ms). 200'e
      # cikarmak (Round 4/5) DAHA KOTU sonuc verdi (p95 1.09-1.58s) - bu host'ta (8 cekirdek)
      # ~200 es zamanli Postgres backend'i CPU/kilit rekabetine giriyor; "daha buyuk pool
      # daha iyi" varsayimi burada YANLIS. 150 - olcumle bulunan tatli nokta - geri kondu.
      # Connection Idle Lifetime=60: bos duran pool baglantilari 5 dk yerine 60 sn'de
      # kapatilir - bir yuk patlamasindan sonra sunucu slotlari cok daha hizli serbest kalir
      # (LOADTEST.md Round 1: 500 VU'luk spike'tan DAKIKALAR sonra bile disaridan psql
      # baglantisi reddediliyordu).
      ConnectionStrings__Default: Host=${POSTGRES_HOST:-db};Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-abdera};Username=${POSTGRES_USER:-abdera};Password=${POSTGRES_PASSWORD:?};Maximum Pool Size=150;Connection Idle Lifetime=60
      # CORS izin verilen origin(ler). Production'da Caddy tek domain sunar - api ve web
      # ayni origin'de oldugu icin CORS pratikte devre disi kalir, ama deger yine de
      # dogru olmali (yanlis origin cerezli istekleri sessizce reddeder). Gelistirmede
      # virgulle ikinci bir origin eklendi: docker-compose'daki "web" (3000) yaninda
      # ".claude/launch.json"daki ayri "npm run dev" frontend'i de (3001) ayni api'ye
      # bakabilsin diye (Program.cs artik Frontend:Origin'i virgulle boluyor).
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:3000,http://localhost:3001}
      Auth__KeysDirectory: /app/keys
    volumes:
      # Data Protection anahtarlari - kalici olmazsa her restart'ta oturumlar dusuer.
      - abdera_dpkeys:/app/keys
    ports:
      # 127.0.0.1: production'da Caddy (prod profili) disindan kimse dogrudan
      # API'ye ulasamasin. Caddy zaten ic docker agindan "api:8080" ile baglanir.
      # Bu ayni zamanda X-Forwarded-For sahteciligini de engeller: Program.cs
      # KnownProxies listesini temizler, yani header'a guvenir - bu ancak API disaridan
      # erisilemezken guvenlidir. Gelistirmede localhost:8080 aynen calisir.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      # Yukaridaki api ile ayni gerekce - production'da trafik Caddy uzerinden gelir.
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

  # --- Production reverse proxy + otomatik HTTPS ---
  # Yalnizca "prod" profilinde calisir: `docker compose --profile prod up -d`.
  # Profil olmadan (gelistirme, CI e2e-smoke) hic baslatilmaz, mevcut akis degismez.
  #
  # Neden gerekli: cerezler Production'da Secure=Always (Program.cs) - duz HTTP uzerinden
  # tarayici cerezi hic gondermez ve giris SESSIZCE calismaz. TLS opsiyonel degil.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [prod]
    environment:
      # ${VAR:?...} KULLANILMAZ: compose bu ifadeyi profilden BAGIMSIZ olarak parse
      # aninda cozer, yani prod profili hic calistirilmasa bile `docker compose up`
      # (gelistirme) hata verirdi. Bos birakilirsa Caddy bos bir site adresiyle acik
      # bir hata verip durur - yalnizca prod profilini baslatan kisi bunu gorur.
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Sertifikalar kalici olmazsa her restart'ta yeniden alinir ve Let's Encrypt
      # hiz limitine takilinir.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  abdera_pgdata:
  abdera_dpkeys:
  caddy_data:
  caddy_config:
